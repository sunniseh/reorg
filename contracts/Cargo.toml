[workspace]
resolver = "2"
members = ["core", "token", "reorg", "integration-tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
reorg-core = { path = "core" }
near-sdk = "5.30"
near-contract-standards = "5.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"

# Small, safe wasm: size-optimized, LTO, abort on panic, overflow checks kept on.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
